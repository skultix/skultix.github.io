<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Marley Reeves (skultix)</title>
    <meta name="description" content="Professional Keyboard Basher.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Marley Reeves (skultix)">
    <meta property="og:description" content="Professional Keyboard Basher.">
    <meta property="og:url" content="https://skultix.sh">
    <meta property="og:site_name" content="skultix.sh">
    <meta property="og:image" content="https://skultix.sh/pfp.png">
    <meta property="og:image:alt" content="Marley Reeves' GitHub avatar">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Marley Reeves (skultix)">
    <meta name="twitter:description" content="Professional Keyboard Basher.">
    <meta name="twitter:image" content="https://skultix.sh/pfp.png">
    <link rel="canonical" href="https://skultix.sh/">
    <link rel="icon" type="image/png" href="/pfp.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
    <link rel="stylesheet" href="https://www.nerdfonts.com/assets/css/webfont.css">
    <style>
        :root {
            --bg: #1a1b26;
            --fg: #c0caf5;
            --dim: #565f89;
            --prompt: #9ece6a;
            --user: #7aa2f7;
            --host: #bb9af7;
            --path: #7dcfff;
            --accent: #e0af68;
            --link: #7dcfff;
            --key-width: 10ch;
        }
        @media (prefers-color-scheme: light) {
            :root {
                --bg: #eff1f5;
                --fg: #4c4f69;
                --dim: #8c8fa1;
                --prompt: #40a02b;
                --user: #1e66f5;
                --host: #8839ef;
                --path: #04a5e5;
                --accent: #df8e1d;
                --link: #04a5e5;
            }
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            height: 100dvh;
            overflow: hidden;
            background: var(--bg);
            color: var(--fg);
            font-family: "JetBrains Mono", ui-monospace, monospace;
            font-size: clamp(13px, 1.6vw, 16px);
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        main {
            width: 100%;
            max-width: 60ch;
        }
        .line { white-space: pre-wrap; }
        .prompt-host { color: var(--user); }
        .prompt-tail { color: var(--dim); }
        .cmd { color: var(--accent); }
        .out { color: var(--fg); }
        .name { color: var(--host); font-weight: 600; }
        .tag { color: var(--dim); font-style: italic; }
        .key { color: var(--prompt); display: inline-block; min-width: var(--key-width); }
        a {
            color: var(--link);
            text-decoration: none;
            border-bottom: 1px dashed transparent;
        }
        a:hover, a:focus-visible {
            border-bottom-color: var(--link);
            outline: none;
        }
        .nf {
            display: inline-block;
            width: 1em;
            text-align: center;
            margin-right: 0.7ch;
            vertical-align: -0.05em;
        }
        .blank { height: 0.6em; }
        .cursor {
            display: inline-block;
            margin-left: 0.1ch;
            color: var(--fg);
            animation: blink 1.05s steps(2, start) infinite;
        }
        @keyframes blink { to { opacity: 0; } }
        @media (prefers-reduced-motion: reduce) {
            .cursor { animation: none; }
        }
        .error {
            color: #f7768e;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <main id="terminal" aria-busy="true"></main>
    <script>
        const ESCAPE = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
        const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ESCAPE[c]);

        const promptHTML = (prompt) =>
            `<span class="prompt-host">${esc(prompt)}</span><span class="prompt-tail">:~$ </span>`;

        const iconHTML = (icon) =>
            icon ? `<i class="nf ${esc(icon)}" aria-hidden="true"></i>` : "";

        const linkHTML = (link) =>
            `<div class="line out">` +
                `<span class="key">${esc(link.key)}</span>` +
                `<a href="${esc(link.url)}" rel="me">${iconHTML(link.icon)}${esc(link.label)}</a>` +
            `</div>`;

        async function render() {
            const main = document.getElementById("terminal");
            const cfg = await fetch("config.json", { cache: "no-cache" }).then(r => {
                if (!r.ok) throw new Error(`config.json: ${r.status}`);
                return r.json();
            });

            document.title = cfg.title;
            document.querySelector('meta[name="description"]').content = `${cfg.title} — ${cfg.bio}.`;

            const maxKeyLen = Math.max(0, ...cfg.links.map(l => (l.key || "").length));
            document.documentElement.style.setProperty("--key-width", `${maxKeyLen + 2}ch`);

            const p = promptHTML(cfg.prompt);
            const parts = [
                `<div class="line">${p}<span class="cmd">whoami</span></div>`,
                `<div class="line out"><span class="name">${esc(cfg.title)}</span></div>`,
                `<div class="line out tag">${esc(cfg.bio)}</div>`,
                `<div class="blank"></div>`,
                `<div class="line">${p}<span class="cmd">links</span></div>`,
                ...cfg.links.map(linkHTML),
                `<div class="blank"></div>`,
                `<div class="line">${p}<span class="cursor" aria-hidden="true">▊</span></div>`,
            ];

            main.innerHTML = parts.join("");
            main.removeAttribute("aria-busy");
        }

        render().catch(err => {
            const main = document.getElementById("terminal");
            main.innerHTML = `<div class="error">failed to load config.json\n${esc(err.message)}</div>`;
            main.removeAttribute("aria-busy");
        });
    </script>
</body>
</html>
